name: SEIC M&E Platform CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Frontend Tests & Build
  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'WEB/ClientApp/package-lock.json'
      
      - name: Install dependencies
        run: cd WEB/ClientApp && npm install
      
      - name: Run linter
        run: cd WEB/ClientApp && npm run lint
      
      - name: Run tests
        run: cd WEB/ClientApp && npm run test:ci
      
      - name: Build frontend
        run: cd WEB/ClientApp && npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: './WEB/ClientApp/coverage/lcov.info'
          flags: frontend
          name: frontend-coverage

  # Job 2: Backend Tests & Build
  backend-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      
      - name: Restore dependencies
        run: dotnet restore WEB/WEB.csproj
      
      - name: Build
        run: dotnet build --configuration Release --no-restore WEB/WEB.csproj
      
      - name: Run tests
        run: dotnet test --configuration Release --no-build --logger "trx" WEB/WEB.csproj
      
      - name: Publish test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dotnet-test-results
          path: '**/TestResults'

  # Job 3: Code Quality Analysis
  code-quality:
    runs-on: ubuntu-latest
    needs: [ frontend-build, backend-build ]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job 4: Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 5: Build and Push Docker Image
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [ frontend-build, backend-build, code-quality, security-scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Deploy to Azure (Staging)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to staging slot
        run: |
          az webapp deployment slot create \
            --resource-group rg-seic-platform \
            --name seic-me-platform \
            --slot staging || true
          
          az webapp deployment container config \
            --resource-group rg-seic-platform \
            --name seic-me-platform \
            --slot staging \
            --enable-cd true

  # Job 7: Deploy to Azure (Production)
  deploy-production:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to production
        run: |
          az webapp deployment slot swap \
            --resource-group rg-seic-platform \
            --name seic-me-platform \
            --slot staging
      
      - name: Run smoke tests
        run: |
          curl -f https://seic-me-platform.azurewebsites.net/health || exit 1
      
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'SEIC Platform deployed to production'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

  # Job 8: Database Migrations
  database-migrations:
    runs-on: ubuntu-latest
    needs: deploy-production
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Run database migrations
        run: |
          sqlcmd -S seic-sql-server.database.windows.net \
            -d SEICDatabase \
            -U seicadmin \
            -P ${{ secrets.SQL_PASSWORD }} \
            -i WEB/Data/Migrations/20251223_InitialSchema.sql
